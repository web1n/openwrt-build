name: Reusable OpenWrt Build

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      source:
        required: true
        type: string
      branch:
        required: true
        type: string
      debug:
        required: false
        type: boolean
        default: false
      selected_target:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    if: ${{ inputs.selected_target == '' || inputs.selected_target == inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space
        uses: FirelightFlagboy/gh-runner-free-disk-space@main

      - name: Set up build environment
        run: |
          # https://openwrt.org/docs/guide-developer/toolchain/install-buildsystem#debianubuntu
          sudo apt update -qq
          sudo apt install -qq build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone code
        run: git clone -b ${{ inputs.branch }} --single-branch --filter=blob:none ${{ inputs.source }} openwrt

      - name: Update feeds
        run: |
          cat ../feeds.conf.more >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        working-directory: ./openwrt

      - name: Patch source code
        run: bash ../patch.sh
        working-directory: ./openwrt

      - name: Make configuration
        run: |
          cat ../configs/common.config > .config
          cat ../configs/common-${{ inputs.arch }}.config >> .config
          cat ../configs/${{ inputs.target }}.config >> .config
          make defconfig
          cat .config
        working-directory: ./openwrt

      - name: Download sources
        run: make download -j$(nproc) V=s
        working-directory: ./openwrt

      - name: Build firmware
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            make -j1 V=s
          else
            make -j$(nproc) V=w
          fi
        working-directory: ./openwrt

      - name: Prepare artifacts
        run: |
          ls -la openwrt/bin/targets/*/*
          mkdir -p ./out/
          cp openwrt/bin/targets/*/*/*.{bin,img,itb,ubi} ./out/ 2>/dev/null || true
          cp openwrt/bin/targets/*/*/config.buildinfo ./out/${{ inputs.target }}.config.buildinfo
          cp openwrt/bin/targets/*/*/*.manifest ./out/
          cp openwrt/.config ./out/${{ inputs.target }}.config

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ inputs.target }}
          path: ./out/*
